name: Android APK

# main dalına her gönderimde APK derlenir ve Releases sayfasına eklenir.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor Android projesini hazırla
        run: |
          npm install --no-audit --no-fund
          mkdir -p www
          cp -r index.html styles.css app.js manifest.webmanifest icons www/
          npx cap add android
          bash android-setup/patch.sh
          npx cap sync android

      - name: APK derle
        run: |
          mkdir -p ~/.android
          cp android-setup/debug.keystore ~/.android/debug.keystore
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../GelisimTakip.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GelisimTakip-apk
          path: GelisimTakip.apk

      - name: Releases sayfasına ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" GelisimTakip.apk \
            --title "Gelişim Takip $TAG" \
            --notes "Telefondan bu sayfayı aç, **GelisimTakip.apk** dosyasını indir ve kur. Önceki sürümün üzerine kurulur, verilerin silinmez."
